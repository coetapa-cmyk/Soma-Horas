  <style>
    body { font-family: system-ui, sans-serif; max-width: 920px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; color: #333; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }

    .form-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button.updating { background: #d97706; }
    button.updating:hover { background: #b45309; }
    button.cancel { background: #64748b; }
    button.cancel:hover { background: #475569; }
    button.reset-page { background: #dc2626; font-size: 13px; padding: 10px 16px; }
    button.reset-page:hover { background: #b91c1c; }
    button.export { background: #16a34a; }
    button.export:hover { background: #15803d; }
    button.edit { background: #0284c7; padding: 5px 10px; font-size: 12px; margin-right: 4px; }
    button.edit:hover { background: #0369a1; }
    button.delete { background: #dc2626; padding: 5px 10px; font-size: 12px; }
    button.delete:hover { background: #b91c1c; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
    th { background: #f8fafc; }
    tfoot td { font-weight: bold; background: #f1f5f9; border-top: 2px solid #cbd5e1; }
    
    .resumo { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .badge { background: #e0e7ff; color: #1e40af; padding: 8px 12px; border-radius: 6px; font-weight: bold; }
    .tag-extra { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
